name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back_nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back_nest/package-lock.json
      - run: npm ci
      # El lint aún tiene errores heredados: se informa pero no bloquea.
      - run: npx eslint "{src,test}/**/*.ts"
        continue-on-error: true
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semillero-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: semillero-frontend/package-lock.json
      - run: npm ci
      # El lint aún tiene errores heredados: se informa pero no bloquea.
      - run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mamba-app .
      - run: docker build -t mamba-chatbot ./mamba-ai-service
