services:
  db:
    image: postgres:15-alpine
    container_name: mamba_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mamba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mamba1234}
      POSTGRES_DB: ${POSTGRES_DB:-semillero_mamba}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mamba} -d ${POSTGRES_DB:-semillero_mamba}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CHAT_URL: ${NEXT_PUBLIC_CHAT_URL:-http://localhost:8001}
    container_name: mamba_app
    restart: unless-stopped
    environment:
      APP_PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mamba}:${POSTGRES_PASSWORD:-mamba1234}@db:5432/${POSTGRES_DB:-semillero_mamba}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-mamba}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mamba1234}
      DB_DATABASE: ${POSTGRES_DB:-semillero_mamba}
      JWT_SECRET: ${JWT_SECRET:-123456789}
      SECRET_KEY: ${SECRET_KEY:-123456789}
    ports:
      - "8000:8000"
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
